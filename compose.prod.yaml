# Production Docker Compose Configuration for Local Machine

services:
  # PostgreSQL Database (Shared between prod and dev)
  nicefolio_db:
    image: postgres:16
    container_name: nicefolio_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
    volumes:
      - nicefolio_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${PORT_POSTGRES:-5432}:5432" # Exposed to host for dev container access
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Production GUI Application
  nicefolio_gui:
    image: python:3.13-slim
    container_name: nicefolio_gui
    env_file:
      - .env # All environment variables loaded from .env file
    working_dir: /app
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${PORT_NICEGUI:-8888}:8080" # Note: NiceGUI runs on 8080 internally
    depends_on:
      nicefolio_db:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "main.py"]
    environment:
      - POSTGRES_HOST=nicefolio_db
      - POSTGRES_PORT=5432
    # Build dependencies and install packages on first run
    # Entrypoint handles: DB init, config seeding, then starts app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import requests; requests.get("http://localhost:8080")'' || exit 1',
        ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s # 2 min start + 10 retries (30s each) = 7 min max

  # Production Scheduler (Runs automatic jobs)
  nicefolio_worker:
    image: python:3.13-slim
    container_name: nicefolio_worker
    env_file:
      - .env # All environment variables loaded from .env file
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=nicefolio_db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      nicefolio_db:
        condition: service_healthy
      nicefolio_gui:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "worker/scheduler.py"]
    # Build dependencies and install packages on first run
    # Entrypoint handles: DB init, config seeding, then starts scheduler

volumes:
  nicefolio_data:
